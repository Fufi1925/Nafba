name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Nafba-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v') && vars.NAFBA_RELEASE_SIGNING_READY == 'true'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        env:
          KEYSTORE: ${{ secrets.NAFBA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Missing release signing secrets; see docs/RELEASING.md'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/nafba.jks"
      - name: Build signed release
        env:
          NAFBA_KEYSTORE: ${{ runner.temp }}/nafba.jks
          NAFBA_STORE_PASSWORD: ${{ secrets.NAFBA_STORE_PASSWORD }}
          NAFBA_KEY_PASSWORD: ${{ secrets.NAFBA_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Publish APK and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Nafba-${RELEASE_TAG}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cd ..
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "Nafba ${RELEASE_TAG}" --notes-file docs/RELEASE_NOTES.md --prerelease --verify-tag
          fi
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nafba.jks"
